name: Campus routes regression

on:
  push:
    paths:
      - 'DataStructure-Project/实验10-校园导游.c'
      - 'tests/test_campus_routes.py'
      - 'tests/campus_routes_driver.c'
      - 'tests/fixtures/campus_demo.txt'
      - '.github/workflows/campus-routes.yml'
  pull_request:
    paths:
      - 'DataStructure-Project/实验10-校园导游.c'
      - 'tests/test_campus_routes.py'
      - 'tests/campus_routes_driver.c'
      - 'tests/fixtures/campus_demo.txt'
      - '.github/workflows/campus-routes.yml'

permissions:
  contents: read

jobs:
  regression:
    name: Campus routes (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, sanitize]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run campus route regression tests
        if: matrix.mode == 'normal'
        run: python3 tests/test_campus_routes.py -v
      - name: Run campus route tests with ASan and UBSan
        if: matrix.mode == 'sanitize'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 tests/test_campus_routes.py --sanitize -v
