name: Youth candidates regression

on:
  push:
    paths:
      - 'DataStructure-Project/实验12-校园十大优秀青年评比.c'
      - 'tests/test_youth_candidates.py'
      - 'tests/youth_candidates_driver.c'
      - 'tests/fixtures/youth_demo.txt'
      - '.github/workflows/youth-candidates.yml'
  pull_request:
    paths:
      - 'DataStructure-Project/实验12-校园十大优秀青年评比.c'
      - 'tests/test_youth_candidates.py'
      - 'tests/youth_candidates_driver.c'
      - 'tests/fixtures/youth_demo.txt'
      - '.github/workflows/youth-candidates.yml'

permissions:
  contents: read

jobs:
  regression:
    name: Youth candidates (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, sanitize]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run youth candidate regression tests
        if: matrix.mode == 'normal'
        run: python3 tests/test_youth_candidates.py -v
      - name: Run youth candidate tests with ASan and UBSan
        if: matrix.mode == 'sanitize'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 tests/test_youth_candidates.py --sanitize -v
