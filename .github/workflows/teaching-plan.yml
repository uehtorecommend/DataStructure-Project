name: Teaching plan regression
on:
  push:
    paths:
      - 'DataStructure-Project/实验2-教学计划编制.cpp'
      - 'tests/*teaching*'
      - 'tests/fixtures/teaching_even.txt'
      - '.github/workflows/teaching-plan.yml'
  pull_request:
    paths:
      - 'DataStructure-Project/实验2-教学计划编制.cpp'
      - 'tests/*teaching*'
      - 'tests/fixtures/teaching_even.txt'
      - '.github/workflows/teaching-plan.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, sanitize]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regression
        if: matrix.mode == 'normal'
        run: python3 tests/test_teaching_plan.py -v
      - name: ASan and UBSan
        if: matrix.mode == 'sanitize'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 tests/test_teaching_plan.py --sanitize -v
